[project]
name = "peglin-korean-revised"
version = "0.1.0"
description = "Local extraction and review tools for Peglin Korean localization"
requires-python = ">=3.11"
dependencies = ["unitypy==1.25.3"]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
peglin-l10n = "peglin_l10n.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peglin_l10n"]
