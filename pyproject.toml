[project]
name = "peglin-korean-revised"
version = "0.1.0"
description = "Local extraction and review tools for Peglin Korean localization"
requires-python = ">=3.11"
dependencies = ["unitypy==1.25.4"]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
peglin-l10n = "peglin_l10n.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peglin_l10n"]

[tool.maintenance]
python = "3.11"
uv = "0.9.7"

[dependency-groups]
dev = ["ruff==0.17.0"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
force-exclude = true
extend-exclude = [
    ".github/codeql-reference-stubs",
    "extracted",
    "patches/candidates",
    "patches/generated",
    "plugin/bin",
    "plugin/obj",
    "reports/generated",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These are loaded from a reviewed immutable commit by the release workflow.
".github/scripts/publish_release.py" = ["I001"]
".github/scripts/verify_release_artifacts.py" = ["I001"]

[tool.ruff.format]
line-ending = "lf"
