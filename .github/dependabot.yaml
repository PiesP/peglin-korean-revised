version: 2
registries:
  nuget-org:
    type: "nuget-feed"
    url: "https://api.nuget.org/v3/index.json"
  bepinex:
    type: "nuget-feed"
    url: "https://nuget.bepinex.dev/v3/index.json"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "PiesP"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/plugin"
    registries:
      - "nuget-org"
      - "bepinex"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "PiesP"
    groups:
      dotnet-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    reviewers:
      - "PiesP"
    groups:
      actions:
        patterns:
          - "*"
