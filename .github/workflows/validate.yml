name: Validate translations

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.9.7"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Compile package
        run: uv run python -m compileall -q src/peglin_l10n
      - name: Run package tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Validate override metadata
        run: uv run peglin-l10n lint-overrides
