name: Validate translations

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve maintenance toolchains
        id: toolchains
        run: python3 .github/scripts/resolve_toolchains.py
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ steps.toolchains.outputs.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: ${{ steps.toolchains.outputs.uv }}
          enable-cache: false
      - name: Install locked dependencies
        env:
          PYTHON_VERSION: ${{ steps.toolchains.outputs.python }}
        run: uv sync --locked --python "$PYTHON_VERSION"
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Compile package
        run: uv run --locked python -m compileall -q src/peglin_l10n
      - name: Run package tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Validate override metadata
        run: uv run --locked peglin-l10n lint-overrides
