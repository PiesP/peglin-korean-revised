name: Release Korean translation patch

on:
  workflow_dispatch:
  push:
    tags:
      - "peglin-ko-v*"

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: translation-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-source:
    name: Verify release or toolchain-check source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      release_tag: ${{ steps.verify.outputs.release_tag }}
      tag_object_sha: ${{ steps.verify.outputs.tag_object_sha }}
    steps:
      - name: Require default branch for manual verification
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ github.ref }}
          DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [[ "$SOURCE_REF" != "$DEFAULT_BRANCH_REF" ]]; then
            echo "Manual verification must run from the default branch." >&2
            exit 1
          fi
      - name: Check out the source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve maintenance toolchains
        id: toolchains
        run: python3 .github/scripts/resolve_toolchains.py
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchains.outputs.python }}
      - name: Verify eligible pull request or administrator issue update
        if: github.event_name == 'push'
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTOR: ${{ github.actor }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_release_source.py
      - name: Require an eligible tagged source
        if: github.event_name == 'push' && steps.verify.outputs.eligible != 'true'
        run: |
          echo "The version tag does not point to an eligible release source." >&2
          exit 1

  build:
    name: Build patch or verify release toolchain
    needs: verify-release-source
    if: needs.verify-release-source.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify-release-source.outputs.eligible == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve maintenance toolchains
        id: toolchains
        run: python3 .github/scripts/resolve_toolchains.py
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchains.outputs.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.toolchains.outputs.uv }}
          enable-cache: false
      - name: Verify uv version
        env:
          UV_VERSION: ${{ steps.toolchains.outputs.uv }}
        run: |
          actual="$(uv --version)"
          echo "$actual"
          actual_version="${actual#uv }"
          test "${actual_version%% *}" = "$UV_VERSION"
      - name: Install locked dependencies
        env:
          PYTHON_VERSION: ${{ steps.toolchains.outputs.python }}
        run: uv sync --locked --python "$PYTHON_VERSION"
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Compile package
        run: uv run --locked python -m compileall -q src/peglin_l10n
      - name: Run package tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Validate contributor data
        run: uv run --locked peglin-l10n lint-overrides
      - name: Build release files
        if: github.event_name == 'push' && needs.verify-release-source.outputs.eligible == 'true'
        env:
          SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.verify-release-source.outputs.release_tag }}
          OUTPUT_DIR: ${{ runner.temp }}/peglin-release
        run: >-
          uv run --locked peglin-l10n build-release-candidate
          --source-revision "$SOURCE_SHA"
          --release-tag "$RELEASE_TAG"
          --output-dir "$OUTPUT_DIR"
      - name: Upload release files
        if: github.event_name == 'push' && needs.verify-release-source.outputs.eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: peglin-translation-release-${{ needs.verify-release-source.outputs.release_tag }}
          path: ${{ runner.temp }}/peglin-release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [verify-release-source, build]
    if: github.event_name == 'push' && needs.verify-release-source.outputs.eligible == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Load reviewed publication helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: PiesP/peglin-korean-revised
          ref: 2eb2f06f1d2215efb419bcc9763166bc49326327
          path: .trusted-release
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/verify_release_artifacts.py
            .github/scripts/publish_release.py
      - name: Download files built by this workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: peglin-translation-release-${{ needs.verify-release-source.outputs.release_tag }}
          path: ${{ runner.temp }}/peglin-release
      - name: Verify provenance and checksums
        id: verify
        env:
          SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.verify-release-source.outputs.release_tag }}
          TAG_OBJECT_SHA: ${{ needs.verify-release-source.outputs.tag_object_sha }}
          RELEASE_DIR: ${{ runner.temp }}/peglin-release
        run: python3 .trusted-release/.github/scripts/verify_release_artifacts.py
      - name: Create release for the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify-release-source.outputs.source_sha }}
          RELEASE_DIR: ${{ runner.temp }}/peglin-release
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
          TAG_OBJECT_SHA: ${{ needs.verify-release-source.outputs.tag_object_sha }}
          PRERELEASE: ${{ steps.verify.outputs.prerelease }}
          OVERLAY_NAME: ${{ steps.verify.outputs.overlay }}
        run: python3 .trusted-release/.github/scripts/publish_release.py
