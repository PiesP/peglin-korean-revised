name: Build Peglin Korean client candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peglin-client-candidate-build
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, peglin-game]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.9.7"
          enable-cache: false
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install locked dependencies
        run: uv sync --locked --python 3.11
      - name: Check .NET SDK
        run: dotnet --info
      - name: Build source-bound client candidate
        run: >-
          uv run --python 3.11 peglin-l10n build-candidate
          --game-root "/mnt/c/Program Files (x86)/Steam/steamapps/common/Peglin"
          --output-dir "$RUNNER_TEMP/peglin-candidate/overlay"
          --candidate-dir "$RUNNER_TEMP/peglin-candidate/package"
      - name: Upload JSON overlay and installable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: peglin-korean-client-candidate
          path: |
            ${{ runner.temp }}/peglin-candidate/overlay/*.json
            ${{ runner.temp }}/peglin-candidate/package/*.zip
          if-no-files-found: error
          retention-days: 14
