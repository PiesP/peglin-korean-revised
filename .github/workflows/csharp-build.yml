name: C# Build

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: csharp-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  csharp-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Check overlay session lifecycle contracts
        run: dotnet run --project tests/csharp/OverlaySessionContracts/OverlaySessionContracts.csproj --configuration Release
      # Hosted runners build against the maintained public API stubs only.
      # The locked game DLLs and in-game behavior need separate local validation.
      - name: Build public reference stubs
        env:
          REFERENCE_DIR: ${{ runner.temp }}/peglin-managed-references
        run: python3 .github/scripts/build_public_stub_plugin.py stubs "$REFERENCE_DIR"
      - name: Build C# plugin
        env:
          REFERENCE_DIR: ${{ runner.temp }}/peglin-managed-references
        run: python3 .github/scripts/build_public_stub_plugin.py plugin "$REFERENCE_DIR"
