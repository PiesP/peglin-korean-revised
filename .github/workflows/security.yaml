name: Security Scanning

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Resolve the scanner runtime to an immutable image digest; review updates at
  # https://github.com/google/osv-scanner-action/releases.
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6 # v2.7.0

jobs:
  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: manual
          - language: python
            build-mode: none
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only the public API reference stubs before CodeQL tracing. The
      # real Peglin and Unity managed DLLs are not copied to hosted runners.
      - name: Build public reference stubs
        if: ${{ matrix.language == 'csharp' }}
        env:
          CODEQL_REFERENCE_DIR: ${{ runner.temp }}/peglin-managed-references
        run: python3 .github/scripts/build_public_stub_plugin.py stubs "$CODEQL_REFERENCE_DIR"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - ".github/codeql-reference-stubs/**"
      - name: Build C# plugin for CodeQL
        if: ${{ matrix.language == 'csharp' }}
        env:
          CODEQL_REFERENCE_DIR: ${{ runner.temp }}/peglin-managed-references
        run: python3 .github/scripts/build_public_stub_plugin.py plugin "$CODEQL_REFERENCE_DIR"
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  osv:
    name: OSV Dependency Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the uv lockfile
        id: scan
        run: python3 .github/scripts/run_osv_scan.py
      - name: Upload OSV results to code scanning
        if: ${{ !cancelled() && steps.scan.outputs.report == 'true' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif
          category: osv-scanner
