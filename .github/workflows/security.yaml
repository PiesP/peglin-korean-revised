name: Security Scanning

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Resolve the scanner runtime to an immutable image digest; review updates at
  # https://github.com/google/osv-scanner-action/releases.
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6 # v2.7.0

jobs:
  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: manual
          - language: python
            build-mode: none
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET SDK
        if: ${{ matrix.language == 'csharp' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # Build only the public API reference stubs before CodeQL tracing. The
      # real Peglin and Unity managed DLLs are not copied to hosted runners.
      - name: Build public reference stubs
        if: ${{ matrix.language == 'csharp' }}
        env:
          CODEQL_REFERENCE_DIR: ${{ runner.temp }}/peglin-managed-references
        run: python3 .github/scripts/build_public_stub_plugin.py stubs "$CODEQL_REFERENCE_DIR"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - ".github/codeql-reference-stubs/**"
      - name: Build C# plugin for CodeQL
        if: ${{ matrix.language == 'csharp' }}
        env:
          CODEQL_REFERENCE_DIR: ${{ runner.temp }}/peglin-managed-references
        run: python3 .github/scripts/build_public_stub_plugin.py plugin "$CODEQL_REFERENCE_DIR"
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  osv:
    name: OSV Dependency Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    outputs:
      policy: ${{ steps.scan.outputs.policy }}
      report: ${{ steps.scan.outputs.report }}
      upload: ${{ steps.upload.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the uv lockfile
        id: scan
        run: python3 .github/scripts/run_osv_scan.py
      - name: Upload OSV results to code scanning
        id: upload
        if: ${{ !cancelled() && steps.scan.outputs.report == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif
          category: osv-scanner

  security-summary:
    name: Security scan summary
    if: ${{ always() }}
    needs: [osv, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require completed security policy and analyses
        env:
          OSV_RESULT: ${{ needs.osv.result }}
          OSV_POLICY: ${{ needs.osv.outputs.policy }}
          OSV_REPORT: ${{ needs.osv.outputs.report }}
          OSV_UPLOAD: ${{ needs.osv.outputs.upload }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          printf 'OSV=%s policy=%s report=%s upload=%s CodeQL=%s\n' \
            "${OSV_RESULT:-missing}" "${OSV_POLICY:-missing}" "${OSV_REPORT:-missing}" \
            "${OSV_UPLOAD:-missing}" "${CODEQL_RESULT:-missing}"
          [[ "${OSV_RESULT:-}" == success && "${OSV_POLICY:-}" == clean && \
             "${OSV_REPORT:-}" == true && "${OSV_UPLOAD:-}" == success && \
             "${CODEQL_RESULT:-}" == success ]]
