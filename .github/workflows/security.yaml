name: Security Scanning

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Resolve the scanner runtime to an immutable image digest; review updates at
  # https://github.com/google/osv-scanner-action/releases.
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner-action@sha256:71ad04ab2f8798be47870f9b18817ad317c2f8f2f97aa6726ba10d5578bc174a

jobs:
  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: manual
          - language: python
            build-mode: none
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only the public API reference stubs before CodeQL tracing. The
      # real Peglin and Unity managed DLLs are not copied to hosted runners.
      - name: Build public reference stubs
        if: ${{ matrix.language == 'csharp' }}
        env:
          CODEQL_REFERENCE_DIR: ${{ runner.temp }}/peglin-managed-references
        run: python3 .github/scripts/build_public_stub_plugin.py stubs "$CODEQL_REFERENCE_DIR"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - ".github/codeql-reference-stubs/**"
      - name: Build C# plugin for CodeQL
        if: ${{ matrix.language == 'csharp' }}
        env:
          CODEQL_REFERENCE_DIR: ${{ runner.temp }}/peglin-managed-references
        run: python3 .github/scripts/build_public_stub_plugin.py plugin "$CODEQL_REFERENCE_DIR"
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  osv:
    name: OSV Dependency Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the uv lockfile
        id: scan
        run: |
          set -euo pipefail
          result_dir="$RUNNER_TEMP/osv-results"
          result_path="$result_dir/osv-results.sarif"
          install -d -m 0700 "$result_dir"
          rm -f "$result_path"

          scan_status=0
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$result_dir:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=sarif \
            --output-file=/results/osv-results.sarif \
            --lockfile=uv.lock \
            --lockfile=plugin/packages.lock.json \
            . || scan_status=$?

          if [[ ! -s "$result_path" ]]; then
            echo "OSV-Scanner did not produce a SARIF report." >&2
            exit "$((scan_status > 0 ? scan_status : 1))"
          fi
          echo "report=true" >> "$GITHUB_OUTPUT"

          if ((scan_status > 1)); then
            echo "OSV-Scanner failed before completing the scan (exit $scan_status)." >&2
            exit "$scan_status"
          fi
          if ((scan_status == 1)); then
            echo "::warning::Known vulnerable dependencies were found; review the Security tab."
          fi
      - name: Upload OSV results to code scanning
        if: ${{ !cancelled() && steps.scan.outputs.report == 'true' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif
          category: osv-scanner
