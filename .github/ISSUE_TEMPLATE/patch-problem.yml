name: 패치 설치 및 실행 문제
description: 패치 설치, 적용 또는 실행 중 발생한 문제를 제보합니다.
title: "[패치] "
body:
  - type: input
    id: release
    attributes:
      label: 패치 릴리스
      description: 설치한 GitHub Release의 버전이나 이름을 적어 주세요.
    validations:
      required: true
  - type: input
    id: peglin-version
    attributes:
      label: Peglin 버전
      description: 확인할 수 있다면 게임 버전이나 Steam 빌드 ID를 적어 주세요.
    validations:
      required: false
  - type: input
    id: bepinex-version
    attributes:
      label: BepInEx 버전
      description: 사용 중인 Peglin용 BepInEx 팩의 버전을 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: BepInEx 설치 방법
      options:
        - Thunderstore Mod Manager
        - r2modman
        - 수동 설치
        - 기타
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 발생한 문제
      description: 실제로 나타난 현상과 예상했던 결과를 함께 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있도록 실행한 순서를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 관련 로그
      description: BepInEx 로그에서 문제와 관련된 부분을 붙여 넣어 주세요. 개인 정보와 불필요한 전체 로그는 제외해 주세요.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: Peglin을 종료한 상태에서 패치를 설치했습니다.
          required: true
        - label: 최신 릴리스와 README의 설치 안내를 확인했습니다.
          required: true
