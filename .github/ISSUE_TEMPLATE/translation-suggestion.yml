name: 번역 수정 제안
description: 어색하거나 잘못된 한국어 번역을 제안합니다.
title: "[번역] "
body:
  - type: markdown
    attributes:
      value: >-
        이슈로 번역 문제를 제안할 수 있습니다. 관리자가 제안과 사용 권한을 확인한 뒤
        번역에 반영할 수 있습니다. 이슈 내용을 자동으로 복사하거나 반영하지는 않습니다.
        직접 CSV를 수정해 기여하려면 Pull Request를 제출해 주세요. 자세한 내용은
        [기여 안내](https://github.com/PiesP/peglin-korean-revised/blob/master/CONTRIBUTING.ko.md)를
        참고하세요.
  - type: input
    id: term
    attributes:
      label: 용어 키
      description: 알고 있다면 번역 CSV의 Term 값을 정확히 적어 주세요.
      placeholder: "예: MainMenu/Start"
    validations:
      required: false
  - type: input
    id: current-translation
    attributes:
      label: 현재 번역
      description: 게임에 표시된 현재 한국어 문구를 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: proposed-translation
    attributes:
      label: 제안하는 번역
      description: 바꾸고 싶은 한국어 문구를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 문맥과 표시 위치
      description: 어느 화면이나 상황에서 표시되는 문구인지 설명해 주세요.
      placeholder: "예: 전투 보상 화면에서 유물을 선택할 때 표시됩니다."
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: 변경 이유
      description: 현재 번역의 문제와 제안 문구가 더 알맞은 이유를 설명해 주세요.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: 번역 문구 사용 허락 확인
      description: >-
        본인이 제출 권한을 가진 문구에 대해서만 동의해 주세요. 동의하면 프로젝트와
        패치 사용자가 해당 문구를 번역 자료의 일부로 복제·수정·배포·사용할 수 있도록
        전 세계 비독점 무상 이용을 허락합니다. Peglin 게임 콘텐츠의 권리는 포함하지
        않습니다.
      options:
        - label: 번역 기여 이용 허락에 동의하며 제출 권한이 있음을 확인합니다.
          required: true
